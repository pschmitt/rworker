[package]
name = "rworker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Client for ad-hoc build workers: disposable, encrypted OpenStack VMs created on request by a control host"
license = "GPL-3.0-only"
repository = "https://github.com/pschmitt/rworker"
readme = "README.md"

[features]
default = ["web"]
web = ["tokio/io-util", "tokio/process"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = "1.0"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
