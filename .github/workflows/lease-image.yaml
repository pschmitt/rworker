name: Lease image
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lease-image.yaml
      - flake.lock
      - flake.nix
      - nix/lease-image.nix
      - scripts/github-job-agent.py
      - tests/lease-image.sh
  pull_request:
    paths:
      - .github/workflows/lease-image.yaml
      - flake.lock
      - flake.nix
      - nix/lease-image.nix
      - scripts/github-job-agent.py
      - tests/lease-image.sh
  workflow_dispatch: {}
concurrency:
  group: lease-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-image.yaml@main
    with:
      image-name: ghcr.io/pschmitt/rworker-lease
      package: .#lease-image
      platforms: linux/amd64
      test-script: tests/lease-image.sh
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  publish-lease-tag:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx imagetools create --tag ghcr.io/pschmitt/rworker:lease \
            "ghcr.io/pschmitt/rworker-lease:sha-${GITHUB_SHA:0:7}"
