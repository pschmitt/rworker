<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>rworker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad1ff"/>
      <stop offset="1" stop-color="#2b8fd6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8fd6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2b8fd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#f08c2e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- the worker: two solid slabs and one dissolving into the void -->
  <g>
    <rect x="52" y="52" width="152" height="40" rx="10" fill="url(#slab)"/>
    <rect x="52" y="102" width="152" height="40" rx="10" fill="url(#slab)"/>
    <rect x="52" y="152" width="152" height="22" rx="10" fill="url(#fade)"/>
    <g fill="#0b1222" opacity="0.55">
      <rect x="68" y="68" width="64" height="8" rx="4"/>
      <rect x="68" y="118" width="64" height="8" rx="4"/>
    </g>
    <g fill="#7dffb2">
      <circle cx="176" cy="72" r="6"/>
      <circle cx="176" cy="122" r="6"/>
    </g>
    <!-- ephemeral: the last slab breaks into particles -->
    <g fill="#5ad1ff">
      <rect x="62" y="182" width="12" height="12" rx="3" opacity="0.7"/>
      <rect x="86" y="188" width="10" height="10" rx="3" opacity="0.55"/>
      <rect x="108" y="184" width="12" height="12" rx="3" opacity="0.6"/>
      <rect x="72" y="204" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="98" y="208" width="7" height="7" rx="2" opacity="0.3"/>
      <rect x="128" y="200" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="84" y="222" width="5" height="5" rx="1.5" opacity="0.2"/>
      <rect x="116" y="224" width="5" height="5" rx="1.5" opacity="0.18"/>
    </g>
  </g>
  <!-- encrypted: a padlock on the corner -->
  <g transform="translate(160 158)">
    <path d="M14 22 V14 a14 14 0 0 1 28 0 V22" fill="none" stroke="url(#lock)" stroke-width="7" stroke-linecap="round"/>
    <rect x="4" y="20" width="48" height="38" rx="9" fill="url(#lock)"/>
    <circle cx="28" cy="36" r="5" fill="#0b1222"/>
    <rect x="25.5" y="38" width="5" height="10" rx="2.5" fill="#0b1222"/>
  </g>
</svg>
